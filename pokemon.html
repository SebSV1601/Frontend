    <label>

    <label>
        <input type="checkbox" name="primary_type" value="Psychic">

    </label>
    <label>
        <input type="checkbox" name="primary_type" value="Rock">
        Rock
    </label>
    <label>
        <input type="checkbox" name="primary_type" value="Water">
        Water

    <select id="moodSelect">
        <option value="">All Moods</option>
    </select>

    <div id="pokemonList"></div>
